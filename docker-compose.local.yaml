services:
  app:
    ports:
      - "8080:8080"
    env_file:
      - .env.local
    extends:
      file: docker-compose.yaml
      service: app
    restart: no
  db:
    env_file:
      - .env.local
    extends:
      file: docker-compose.yaml
      service: db
    restart: no
  prometheus:
    image: prom/prometheus:latest
    container_name: invest72-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./invest72-config/prometheus.yaml:/etc/prometheus/prometheus.yaml
      - ./prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: no
  grafana:
    image: grafana/grafana
    container_name: invest72-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana-data:/var/lib/grafana
    environment:
      - TZ=Asia/Seoul
    restart: no
